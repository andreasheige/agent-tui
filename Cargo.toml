[package]
name = "agent-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal dashboard for AI coding-agent sessions: hours, projects, cost and concurrency"
license = "MIT"
repository = "https://github.com/andreasheige/agent-tui"
readme = "README.md"
keywords = ["tui", "ratatui", "claude", "ai-agents", "dashboard"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
ratatui = "0.30.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
